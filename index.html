<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>TRAIN. Football</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0a;color:#f5f7f5;font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:80px}
header{padding:24px 18px 14px;display:flex;justify-content:space-between}.logo{font-size:26px;font-weight:900;letter-spacing:2px}.logo i{color:#b8ff3d;font-style:normal}
main{padding:0 15px}.card{background:#121614;border:1px solid #252b27;border-radius:20px;padding:16px;margin:12px 0}.hero{padding:22px;background:linear-gradient(145deg,#1b231d,#111512);border-radius:25px}
.eyebrow{color:#b8ff3d;font-size:11px;font-weight:900;letter-spacing:1.5px}.hero h1{font-size:31px;line-height:1.05;margin:8px 0}.muted{color:#909991;font-size:13px}
button{font:inherit}.primary{width:100%;border:0;background:#b8ff3d;color:#071000;padding:15px;border-radius:14px;font-weight:900;margin-top:15px}
.title{display:flex;justify-content:space-between;align-items:center;margin:20px 3px 9px}.title h2{font-size:18px;margin:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#121614;border:1px solid #252b27;border-radius:13px;text-align:center;padding:9px 2px}.day b{font-size:10px;color:#909991}.day strong{display:block;margin:7px 0}.dot{height:6px;width:6px;border-radius:50%;background:#39413b;margin:auto}.dot.on{background:#b8ff3d}
.head{display:flex;justify-content:space-between;gap:10px}.session{font-size:21px;font-weight:900;margin-top:4px}.tag{font-size:10px;font-weight:900;color:#b8ff3d;background:#202820;border-radius:9px;padding:7px;height:max-content}.bar{height:7px;background:#29302b;border-radius:9px;margin-top:14px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#b8ff3d}
.exercise{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #252b27}.exercise:last-child{border:0}.num{width:34px;height:34px;background:#202620;border-radius:11px;display:grid;place-items:center;color:#b8ff3d;font-size:12px;font-weight:900}.info{flex:1}.name{font-weight:800}.sets{color:#909991;font-size:12px;margin-top:3px}.check{width:38px;height:38px;border-radius:12px;border:1px solid #343c36;background:#151916;color:transparent;font-weight:900}.check.done{background:#b8ff3d;color:#071000;border-color:#b8ff3d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;background:#191e1b;border-radius:15px;padding:13px}.stat strong{display:block;font-size:23px}.stat span{font-size:10px;color:#909991}
.timer{text-align:center;font-size:62px;font-weight:900;margin:20px 0}.row{display:flex;gap:7px}.row button{flex:1;border:1px solid #252b27;background:#191e1b;color:#fff;border-radius:12px;padding:12px;font-weight:800}.row button:first-child{background:#b8ff3d;color:#071000;border-color:#b8ff3d}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:10px 12px 13px;background:rgba(9,11,10,.96);border-top:1px solid #252b27}nav button{background:none;border:0;color:#909991;font-size:11px;font-weight:800}nav button.active{color:#b8ff3d}.hide{display:none!important}
</style></head><body><div class="app"><header><div class="logo">TRAIN<i>.</i></div><button onclick="resetApp()" style="background:none;border:0;color:#fff;font-size:22px">↻</button></header>
<main>
<section id="home"><div class="hero"><div class="eyebrow">FOOTBALL PERFORMANCE</div><h1 id="headline">Ready to train?</h1><div class="muted" id="date"></div><button class="primary" onclick="document.getElementById('exercises').scrollIntoView({behavior:'smooth'})">START SESSION →</button></div>
<div class="title"><h2>This week</h2><span class="muted">7 days</span></div><div class="week" id="week"></div>
<div class="title"><h2>Today's session</h2><span class="muted" id="progress"></span></div><div class="card"><div class="head"><div><div class="muted" id="fullDate"></div><div class="session" id="session"></div></div><span class="tag" id="tag"></span></div><div class="bar"><span id="bar"></span></div><div id="exercises"></div></div>
<div class="title"><h2>Progress</h2></div><div class="stats"><div class="stat"><strong id="streak">0</strong><span>STREAK</span></div><div class="stat"><strong id="sessions">0</strong><span>SESSIONS</span></div><div class="stat"><strong id="weekDone">0/7</strong><span>WEEK</span></div></div></section>
<section id="plan" class="hide"><div class="title"><h2>Weekly Plan</h2></div><div id="planList"></div></section>
<section id="timerPage" class="hide"><div class="title"><h2>Training Timer</h2></div><div class="card"><div class="muted" style="text-align:center">WORK / REST</div><div class="timer" id="timer">01:00</div><div class="row"><button onclick="startTimer()">Start</button><button onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Reset</button></div><div class="row" style="margin-top:8px"><button onclick="setTimer(30)">30s</button><button onclick="setTimer(45)">45s</button><button onclick="setTimer(60)">60s</button><button onclick="setTimer(90)">90s</button></div></div></section>
</main><nav><button class="active" onclick="page('home',this)">⌂<br>HOME</button><button onclick="page('plan',this)">▦<br>PLAN</button><button onclick="page('timerPage',this)">◷<br>TIMER</button></nav></div>
<script>
const P=[["Monday","First Touch + Control","TRAIN",[["Wall passes","3 × 20 each foot"],["Receive + turn","3 × 10 each side"],["Turn + accelerate","3 × 10"],["Inside/outside touches","3 × 45 sec"],["Sole rolls + V-pulls","3 × 45 sec"]]],["Tuesday","Speed + Acceleration","SPEED",[["10m acceleration","6 reps"],["15m sprints","5 reps"],["20m sprints","4 reps"],["Stop → explode","5 reps"],["Dribble → sprint","5 reps"]]],["Wednesday","Recovery","REST",[]],["Thursday","Dribbling","DRIBBLE",[["Cone slalom","5 runs"],["Sharp cuts","4 × 30 sec"],["Feints","3 × 10 each side"],["Stepovers","3 × 10 each side"],["Cone → 10m sprint","5 reps"]]],["Friday","Match Skills","TRAIN",[["Wall pass + first touch","3 × 20"],["Receive → turn → accelerate","3 × 10"],["Slalom + direction change","5 runs"],["Dribble → 10m sprint","5 reps"],["10m acceleration","6 reps"]]],["Saturday","Easy Ball Work","EASY",[["Easy ball touches","5 min"],["Inside/outside touches","3 × 45 sec"],["Sole rolls + V-pulls","3 × 45 sec"],["Easy dribbling","5 min"]]],["Sunday","Full Rest","REST",[]]];
let s=JSON.parse(localStorage.getItem("TRAIN_PWA")||'{"done":{}}'),d=new Date();d.setHours(0,0,0,0);let sec=60,t=null;
const key=x=>x.toISOString().slice(0,10), p=()=>P[d.getDay()===0?6:d.getDay()-1], done=()=>s.done[key(d)]||[];
function render(){let x=p(),a=done();document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});document.getElementById("fullDate").textContent=document.getElementById("date").textContent;document.getElementById("session").textContent=x[1];document.getElementById("tag").textContent=x[2];document.getElementById("progress").textContent=x[3].length?a.length+"/"+x[3].length:"Recovery";document.getElementById("bar").style.width=(x[3].length?a.length/x[3].length*100:0)+"%";let e=document.getElementById("exercises");e.innerHTML=x[3].length?"":"<p class='muted' style='text-align:center;padding:18px'>Recovery day — take it easy.</p>";x[3].forEach((z,i)=>{let r=document.createElement("div");r.className="exercise";r.innerHTML=`<div class="num">${String(i+1).padStart(2,"0")}</div><div class="info"><div class="name">${z[0]}</div><div class="sets">${z[1]}</div></div><button class="check ${a.includes(i)?"done":""}" onclick="toggle(${i})">${a.includes(i)?"✓":""}</button>`;e.appendChild(r)});week();stats();plan()}
function toggle(i){let k=key(d),a=done();s.done[k]=a.includes(i)?a.filter(v=>v!==i):[...a,i];localStorage.setItem("TRAIN_PWA",JSON.stringify(s));render()}
function week(){let box=document.getElementById("week");box.innerHTML="";let m=new Date(d),n=m.getDay();m.setDate(m.getDate()-(n===0?6:n-1));for(let i=0;i<7;i++){let q=new Date(m);q.setDate(m.getDate()+i),x=P[q.getDay()===0?6:q.getDay()-1],a=s.done[key(q)]||[],v=document.createElement("div");v.className="day";v.innerHTML=`<b>${x[0].slice(0,3)}</b><strong>${q.getDate()}</strong><div class="dot ${x[3].length&&a.length>=x[3].length?"on":""}"></div>`;v.onclick=()=>{d=q;render()};box.appendChild(v)}}
function stats(){let n=Object.values(s.done).filter(a=>a.length).length,start=new Date(d),st=0,q=new Date();while(true){let x=P[q.getDay()===0?6:q.getDay()-1],a=s.done[key(q)]||[];if(x[3].length&&a.length>=x[3].length)st++;else if(x[3].length)break;q.setDate(q.getDate()-1);if(st>365)break}let m=new Date(d),g=m.getDay();m.setDate(m.getDate()-(g===0?6:g-1));let w=0;for(let i=0;i<7;i++){let z=new Date(m);z.setDate(m.getDate()+i);let x=P[z.getDay()===0?6:z.getDay()-1],a=s.done[key(z)]||[];if(x[3].length&&a.length>=x[3].length)w++}document.getElementById("streak").textContent=st;document.getElementById("sessions").textContent=n;document.getElementById("weekDone").textContent=w+"/7"}
function plan(){let b=document.getElementById("planList");b.innerHTML="";P.forEach(x=>{let z=document.createElement("div");z.className="card";z.innerHTML=`<div class="head"><div><div class="muted">${x[0]}</div><div class="session">${x[1]}</div></div><span class="tag">${x[2]}</span></div><p class="muted">${x[3].length} drills</p>`;b.appendChild(z)})}
function page(id,b){document.querySelectorAll("main>section").forEach(x=>x.classList.add("hide"));document.getElementById(id).classList.remove("hide");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function showTime(){document.getElementById("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function startTimer(){if(t)return;t=setInterval(()=>{if(sec){sec--;showTime()}else{clearInterval(t);t=null;navigator.vibrate?.(200)}},1000)}
function pauseTimer(){clearInterval(t);t=null}function resetTimer(){pauseTimer();sec=60;showTime()}function setTimer(x){pauseTimer();sec=x;showTime()}
function resetApp(){if(confirm("Reset all training progress?")){s={done:{}};localStorage.setItem("TRAIN_PWA",JSON.stringify(s));render()}}
render();showTime();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
